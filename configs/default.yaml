# All experiment parameters live here. Code must not hard-code any of these values.

seed: 42

paths:
  data_dir: data/coco               # val2017/ and annotations/ go here (not committed)
  annotations: annotations/instances_val2017.json   # relative to data_dir
  images: val2017                   # relative to data_dir
  results_dir: results
  cache_dir: results/cache          # detections cached as {corruption}_{severity}.pt
  figures_dir: results/figures
  split_manifest: results/split.json  # committed: proves the subset is fixed
  summary_csv: results/summary.csv          # one row per condition x scope (committed)
  reliability_csv: results/reliability.csv  # per-bin data for reliability diagrams (committed)
  run_info: results/run_info.json           # timings, versions, hardware of the last sweep

data:
  annotations_url: http://images.cocodataset.org/annotations/annotations_trainval2017.zip
  annotations_member: annotations/instances_val2017.json   # file extracted from the zip
  images_base_url: http://images.cocodataset.org/val2017
  download_workers: 16              # parallel image downloads
  subset_size: 1000
  calibration_size: 250
  evaluation_size: 750
  # Primary analysis: driving-relevant COCO classes (COCO category ids).
  # Images are sampled only from val2017 images containing >= 1 of these classes.
  driving_classes:
    person: 1
    bicycle: 2
    car: 3
    motorcycle: 4
    bus: 6
    truck: 8
    traffic light: 10
    stop sign: 13
  # Safety-relevant groups (must partition driving_classes). Reported separately.
  class_groups:
    vru: [1, 2, 4]              # vulnerable road users: person, bicycle, motorcycle
    vehicle: [3, 6, 8]          # car, bus, truck
    infrastructure: [10, 13]    # traffic light, stop sign
  # Groups/classes with fewer evaluation GT instances than this are reported but flagged
  # as insufficient evidence for claims.
  min_instances_for_claim: 100
  # Secondary analysis: all 80 COCO classes on the same images.
  report_all_classes: true

corruptions:
  names: [fog, snow, motion_blur, gaussian_noise, brightness]
  severities: [1, 2, 3, 4, 5]       # severity 0 (clean) is always evaluated in addition

model:
  name: fasterrcnn_resnet50_fpn_v2
  weights: DEFAULT                  # torchvision COCO_V1 weights
  score_threshold: 0.05             # kept-detection threshold at inference
  detections_per_image: 100
  batch_size: 4
  num_workers: 2                    # DataLoader workers: corrupt images on CPU while GPU infers
  device: auto                      # auto | cpu | cuda
  amp: true                         # fp16 autocast on CUDA; faster but scores differ slightly
  reference_map_val2017: 46.7       # torchvision-published box mAP (all classes, full val2017)

matching:
  iou_threshold: 0.5

metrics:
  dece_bins: 10
  # D-ECE is reported at each operating point: detections below the threshold are dropped
  # before binning. 0.05 = full confidence range; 0.3 = closer to a deployed operating point.
  dece_score_thresholds: [0.05, 0.3]
  bootstrap:
    n_resamples: 1000               # image-level bootstrap
    confidence_level: 0.95

calibration:
  method: confidence_logit          # p' = sigmoid(logit(p) / T), single scalar T
  temperature_bounds: [0.05, 20.0]
  logit_eps: 1.0e-6                 # clip p to [eps, 1 - eps] before logit

plots:
  dpi: 150
  format: png
